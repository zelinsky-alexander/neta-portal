services:
  portal:
    build: .
    image: neta-portal:0.1.0
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      NETA_COORDINATOR_URL: ${NETA_COORDINATOR_URL}
      NETA_COORDINATOR_REQUEST_TIMEOUT_MS: ${NETA_COORDINATOR_REQUEST_TIMEOUT_MS:-5000}
      NETA_COORDINATOR_ADMIN_TOKEN: ${NETA_COORDINATOR_ADMIN_TOKEN:-}
      NETA_COORDINATOR_CA_FILE: /run/secrets/coordinator-ca.pem
      NETA_COORDINATOR_CLIENT_CERT_FILE: /run/secrets/portal-client-cert.pem
      NETA_COORDINATOR_CLIENT_KEY_FILE: /run/secrets/portal-client-key.pem
      NETA_COORDINATOR_ALLOW_INSECURE_HTTP: "false"
      NETA_PORTAL_LEGACY_OPERATOR_API: ${NETA_PORTAL_LEGACY_OPERATOR_API:-true}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./secrets/coordinator-ca.pem:/run/secrets/coordinator-ca.pem:ro
      - ./secrets/portal-client-cert.pem:/run/secrets/portal-client-cert.pem:ro
      - ./secrets/portal-client-key.pem:/run/secrets/portal-client-key.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
