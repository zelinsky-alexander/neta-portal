name: One-shot findings rule links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-rule-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch findings rule navigation
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          replacements = [
              (
                  "import FindingDetail from './FindingDetail';\n",
                  "import FindingDetail from './FindingDetail';\nimport RuleDefinition from './RuleDefinition';\n",
              ),
              (
                  '<th>Subject</th><th>Type</th><th>Severity</th>',
                  '<th>Subject</th><th>Rule / Type</th><th>Severity</th>',
              ),
              (
                  '<td className="mono">{f.type}</td>',
                  '<td className="mono">{f.type&&f.type!==\'-\'&&f.type.includes(\'-\')?<Link to={`/rules/${encodeURIComponent(f.type)}`} className="rule-id-link mono" title={`Open ${f.type} rule definition`}>{f.type}</Link>:f.type}</td>',
              ),
              (
                  '<Route path="/rules" element={<Rules session={s}/>}/>',
                  '<Route path="/rules" element={<Rules session={s}/>}/><Route path="/rules/:ruleId" element={<RuleDefinition/>}/>',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/one-shot-rule-links.yml').unlink()
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/one-shot-rule-links.yml
          git commit -m "Link findings to rule definitions"
          git push origin HEAD:main
